name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the Flutter version used in CI and releases.
  FLUTTER_VERSION: "3.44.1"

jobs:
  check:
    name: Format, analyze, l10n, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Uncomment if you depend on private git packages (add a GH_PAT secret).
      # - name: Configure Git for private packages
      #   run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Create .env
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generated l10n is up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: ARB files in sync
        run: dart run tool/check_l10n.dart

      - name: Test with coverage
        run: flutter test --coverage

      - name: Coverage gate
        run: dart run tool/check_coverage.dart --min 80

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create .env
        run: cp .env.example .env

      - name: Build APK
        run: flutter build apk --debug

  # Proves every combination of `make slim` leaves a green project.
  slim:
    name: Slim without ${{ matrix.without }}
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        without:
          - analytics
          - crash
          - notifications
          - analytics,crash
          - analytics,notifications
          - crash,notifications
          - analytics,crash,notifications

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create .env
        run: cp .env.example .env

      - name: Slim
        run: |
          flutter pub get
          dart run tool/slim.dart --without ${{ matrix.without }}

      - name: Check
        run: make check

  # Keeps a ready-to-clone `slim` branch: main with every optional module
  # removed. Rebuilt from scratch on each push to main.
  publish-slim:
    name: Publish slim branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-android, slim]
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Slim everything
        run: |
          cp .env.example .env
          flutter pub get
          dart run tool/slim.dart --without analytics,crash,notifications
          make check

      - name: Push slim branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B slim
          git add -A
          git commit -m "Slim: main without analytics, crash reporting and notifications"
          git push --force origin slim
